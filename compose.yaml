services:
  db:
    image: postgres:latest
    container_name: clanrs3-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=UTC
      - PGTZ=UTC
    ports:
      - '${POSTGRES_MACHINE_PORT}:${POSTGRES_PORT}'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
